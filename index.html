<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="#" id="navHome">Home</a>
  <a href="#" id="navContact">Contact</a>
  <a href="#" id="navShop">Shop</a>
</nav>

<main>

  <div class="view active" id="view-home">
    <div class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 34 L30 26 A20 20 0 0 1 70 26 L70 34" stroke="#2c5f4f" stroke-width="4" stroke-linecap="round"/>
        <path d="M22 34 H78 L74 82 A6 6 0 0 1 68 88 H32 A6 6 0 0 1 26 82 Z" fill="#2c5f4f" opacity="0.08" stroke="#2c5f4f" stroke-width="4" stroke-linejoin="round"/>
      </svg>
    </div>
    <button class="shop-btn" id="shopBtn" type="button">Click to shop</button>
  </div>

  <div class="view" id="view-categories">
    <div class="categories">
      <button class="cat-card" data-target="clothes">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 4 L4 7 L6 10 L8 8.5 V20 H16 V8.5 L18 10 L20 7 L16 4 A4 4 0 0 1 8 4 Z"/>
        </svg>
        <span>Clothes</span>
      </button>
      <button class="cat-card" data-target="shoes">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18 V13 C6 13 7 10 9 10 C10.5 10 10.5 12 12.5 12 C15 12 15.5 9 18 9 C20 9 21 11 21 14 V18 Z"/>
          <path d="M3 18 H21"/>
        </svg>
        <span>Shoes</span>
      </button>
      <button class="cat-card" data-target="accessories">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="9" width="16" height="11" rx="2"/>
          <path d="M8 9 V6 A4 4 0 0 1 16 6 V9"/>
        </svg>
        <span>Accessories</span>
      </button>
    </div>
  </div>

  <div class="view" id="view-clothes">
    <div class="detail-header"><h2>Clothes</h2></div>
    <div class="product-grid">
      <div class="product-tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M8 4 L4 7 L6 10 L8 8.5 V20 H16 V8.5 L18 10 L20 7 L16 4 A4 4 0 0 1 8 4 Z"/></svg></div>
      <div class="product-tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M8 4 L4 7 L6 10 L8 8.5 V20 H16 V8.5 L18 10 L20 7 L16 4 A4 4 0 0 1 8 4 Z"/></svg></div>
      <div class="product-tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M8 4 L4 7 L6 10 L8 8.5 V20 H16 V8.5 L18 10 L20 7 L16 4 A4 4 0 0 1 8 4 Z"/></svg></div>
      <div class="product-tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M8 4 L4 7 L6 10 L8 8.5 V20 H16 V8.5 L18 10 L20 7 L16 4 A4 4 0 0 1 8 4 Z"/></svg></div>
    </div>
    <button class="back-btn" data-back="categories">← Back</button>
  </div>

  <div class="view" id="view-shoes">
    <div class="detail-header"><h2>Shoes</h2></div>
    <div class="product-grid">
      <div class="product-tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M3 18 V13 C6 13 7 10 9 10 C10.5 10 10.5 12 12.5 12 C15 12 15.5 9 18 9 C20 9 21 11 21 14 V18 Z"/><path d="M3 18 H21"/></svg></div>
      <div class="product-tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M3 18 V13 C6 13 7 10 9 10 C10.5 10 10.5 12 12.5 12 C15 12 15.5 9 18 9 C20 9 21 11 21 14 V18 Z"/><path d="M3 18 H21"/></svg></div>
      <div class="product-tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M3 18 V13 C6 13 7 10 9 10 C10.5 10 10.5 12 12.5 12 C15 12 15.5 9 18 9 C20 9 21 11 21 14 V18 Z"/><path d="M3 18 H21"/></svg></div>
      <div class="product-tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M3 18 V13 C6 13 7 10 9 10 C10.5 10 10.5 12 12.5 12 C15 12 15.5 9 18 9 C20 9 21 11 21 14 V18 Z"/><path d="M3 18 H21"/></svg></div>
    </div>
    <button class="back-btn" data-back="categories">← Back</button>
  </div>

  <div class="view" id="view-accessories">
    <div class="detail-header"><h2>Accessories</h2></div>
    <div class="product-grid">
      <div class="product-tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M8 9 V6 A4 4 0 0 1 16 6 V9"/></svg></div>
      <div class="product-tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M8 9 V6 A4 4 0 0 1 16 6 V9"/></svg></div>
      <div class="product-tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M8 9 V6 A4 4 0 0 1 16 6 V9"/></svg></div>
      <div class="product-tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M8 9 V6 A4 4 0 0 1 16 6 V9"/></svg></div>
    </div>
    <button class="back-btn" data-back="categories">← Back</button>
  </div>

  <div class="view" id="view-contact">
    <div class="detail-header"><h2>Contact</h2></div>
    <p class="contact-note">Questions about an order or just want to say hi? Send a note below.</p>
    <form class="contact-form" id="contactForm">
      <div>
        <label for="cName">Name</label>
        <input type="text" id="cName" name="name" placeholder="Your name">
      </div>
      <div>
        <label for="cEmail">Email</label>
        <input type="email" id="cEmail" name="email" placeholder="you@example.com">
      </div>
      <div>
        <label for="cMessage">Message</label>
        <textarea id="cMessage" name="message" placeholder="How can we help?"></textarea>
      </div>
      <div class="contact-actions">
        <button class="shop-btn" type="submit">Send message</button>
        <button class="back-btn" type="button" data-back="home">← Back</button>
      </div>
    </form>
  </div>

</main>

<script src="script.js"></script>

</body>
</html>
